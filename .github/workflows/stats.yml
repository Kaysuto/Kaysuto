name: Stats GitHub

# Refreshes the GitHub figures (cards "Mon activité", "Mes commits", Jelly) from the GitHub API, then commits them if they changed.
# COMMITS_TOKEN (optional secret): a personal token that can read the private repositories counted on "Mes commits".
on:
  schedule:
    - cron: '17 */6 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: stats
  cancel-in-progress: true

jobs:
  stats:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: design
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: design/package-lock.json
      - run: npm ci
      - run: npm run stats
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          COMMITS_TOKEN: ${{ secrets.COMMITS_TOKEN }}
      - run: npm run build
      - name: Commit if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A ../assets data
          git diff --cached --quiet || (git commit -m "Stats GitHub à jour" && git push)
